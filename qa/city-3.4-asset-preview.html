<!doctype html><html lang="zh"><meta charset="utf-8"><base href="../dist/"><title>3.4 City Plan Review</title><style>body{margin:0;background:#9daeb9;font:14px system-ui}canvas{display:block}nav{position:fixed;top:14px;left:14px;background:#1b242bde;padding:12px;color:#ddd;max-width:420px}button{margin-right:6px;padding:8px;color:#fff;background:#3b4d57;border:1px solid #74828b}pre{font-size:10px;max-height:100px;overflow:auto}</style><nav><b>Vesper 3.4 / three distinct streets</b><p>Woven street / lower + upper walk · Foundry / sawtooth halls · Sky Forum / civic colonnade</p><button data-view="street">织桥街</button><button data-view="skyline">机造里</button><button data-view="upper">半环议庭</button><button data-view="boulevard">上城大道</button><button data-view="fox">狐狸</button><button data-view="dog">柴犬</button><button id="hide">隐藏面板</button><pre id="stats">Loading</pre></nav><script type="module">
import*as THREE from './vendor/three.module.js';
import{RoadsterSim}from './physics.js';
import{createEnvironment}from './city-environment.js';
import{SUN_DIRECTION}from './irradiance-math.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.90;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.15,1800),sim=new RoadsterSim(),geometry=sim.getWorldGeometry(),geometryBefore=JSON.stringify(geometry),environment=createEnvironment(scene,renderer,geometry,camera);
environment.setQuality('high');environment.resize();
const views={street:[[-200,2.4,-299],[-198,6.2,-252]],skyline:[[100,2.3,291],[105,8.2,342]],upper:[[488,10.2,342],[528,17,367]],boulevard:[[400,10.2,230],[400,16,340]],fox:[[-205.0,1.05,-359.5],[-207.0,.45,-361.6]],dog:[[321.5,8.9,277.3],[320.4,8.45,279.4]]};
function setView(id){const v=views[id];camera.position.set(...v[0]);camera.lookAt(...v[1]);environment.resize();}
document.querySelector('#hide').onclick=()=>document.querySelector('nav').hidden=true;addEventListener('keydown',e=>{if(e.code==='Escape')document.querySelector('nav').hidden=false;});
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>setView(button.dataset.view));setView('street');await environment.ready;
const geometryHash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(geometry))))].map(n=>n.toString(16).padStart(2,'0')).join('');const canonicalGeometry=JSON.stringify(geometry,(_key,value)=>typeof value==='number'?Math.round(value*1e9)/1e9:value);const roundedGeometryHash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonicalGeometry)))].map(n=>n.toString(16).padStart(2,'0')).join('');const observedBake=await(await fetch(new URL('./assets/irradiance/manifest.json',document.baseURI))).json();
setInterval(()=>document.querySelector('#stats').textContent=JSON.stringify({geometryHash,roundedGeometryHash,geometryUnchangedByRenderer:geometryBefore===JSON.stringify(geometry),geometryCount:geometry.length,stairStarts:geometry.filter(g=>g.id==='plan-weave-stair--1-0'||g.id==='plan-weave-stair-1-0').map(g=>({id:g.id,position:g.position})),observedBakeGeometryHash:observedBake.geometrySHA256,plan:environment.stats.cityPlan,architecture:environment.stats.architecture,streetLife:environment.stats.streetLife}),1000);
let before=performance.now();renderer.setAnimationLoop(time=>{const dt=Math.min((time-before)/1000,.05);before=time;environment.update(time/1000,camera.position);renderer.toneMappingExposure=environment.exposureAt(camera.position,!sim.traceSurface(camera.position,{x:SUN_DIRECTION[0],y:SUN_DIRECTION[1],z:SUN_DIRECTION[2]},900));renderer.render(scene,camera);});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();environment.resize();});
</script></html>
