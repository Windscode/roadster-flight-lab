<!doctype html><meta charset="utf-8"><title>Original 28e9 native matrix</title><style>body{margin:24px;background:#181d22;color:#dee7e4;font:16px system-ui;line-height:1.6}a{color:#92ddde}img{max-width:100%;height:auto}figure{margin:24px 0}p{max-width:90ch}</style><h1>28e9 · Original fourteen-frame native matrix</h1><p>Unmodified 1280×720 original PNGs, with the original 14 cases and 20 s request deadline. Read <a href="report.json">the source, draw, phase and individual visual review</a> and <a href="gpu-switch-matrix.json">the complete original application report</a>. CSS only changes displayed size.</p><figure><h2>01-high-clear-day-viaduct</h2><a href="01-high-clear-day-viaduct.png"><img src="01-high-clear-day-viaduct.png" loading="lazy"></a><figcaption>The road, lane boundaries, repeated ground-storey facades, overhead decks, columns, signs and sky are present in the actual image. The covered foreground and storefront glazing remain dark in daylight. A flat polygon on the near roadway is visibly detached from the paving; its appearance is recorded without calling it missing geometry.</figcaption><a href="01-high-clear-day-viaduct.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>01-high-clear-day-vehicle</h2><a href="01-high-clear-day-vehicle.png"><img src="01-high-clear-day-vehicle.png" loading="lazy"></a><figcaption>The white vehicle, layered wheels, storefront signs, table-and-chair set, food stalls and pedestrian paving are visibly rendered. The broad dark front opening and glazing remain simplified. The dark rectangular road fitting in the near foreground has weak material/installation cues.</figcaption><a href="01-high-clear-day-vehicle.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>02-high-wet-night-viaduct</h2><a href="02-high-wet-night-viaduct.png"><img src="02-high-wet-night-viaduct.png" loading="lazy"></a><figcaption>Warm pools illuminate the near road and elevated deck undersides; wet-road reflections and sparse upper windows provide separate visible layers. High storey bodies and side storefront pockets remain very dark. Some distant light rectangles are clipped. This is not a uniformly lit city or photographic lighting claim.</figcaption><a href="02-high-wet-night-viaduct.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>02-high-wet-night-vehicle</h2><a href="02-high-wet-night-vehicle.png"><img src="02-high-wet-night-vehicle.png" loading="lazy"></a><figcaption>Warm practical lights reveal the vehicle, near paving, shopfront panels and food stall; separate white headlamp pools are visible. The headlamp pools clip to white and material detail remains stylized. The flat foreground road fitting remains conspicuous.</figcaption><a href="02-high-wet-night-vehicle.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>03-ultra-wet-night-viaduct</h2><a href="03-ultra-wet-night-viaduct.png"><img src="03-ultra-wet-night-viaduct.png" loading="lazy"></a><figcaption>The formerly failing fifth case now has its original full-resolution PNG. Street depth, warm deck undersides, road reflections, columns and lit windows are all visible. The switch to ultra preserves these structures. Outer facade bodies remain dark and distant bright fixtures remain clipped; successful collection does not establish a large artistic improvement over high.</figcaption><a href="03-ultra-wet-night-viaduct.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>03-ultra-wet-night-vehicle</h2><a href="03-ultra-wet-night-vehicle.png"><img src="03-ultra-wet-night-vehicle.png" loading="lazy"></a><figcaption>The vehicle, lamps, glass outline, wheel faces, paving and storefront furniture remain present after the high-to-ultra wet switch. Near headlamp white clipping and the simplified nose/interior remain. No new missing major object is visible in this frame.</figcaption><a href="03-ultra-wet-night-vehicle.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>04-ultra-clear-day-viaduct</h2><a href="04-ultra-clear-day-viaduct.png"><img src="04-ultra-clear-day-viaduct.png" loading="lazy"></a><figcaption>Daylight, blue sky and the original ground-storey/overhead structure return after the wet-night sequence. The roadway and lane marks remain legible. The covered road and facade recesses still form broad dark regions, and distant buildings repeat. The flat near road polygon remains visually distinct.</figcaption><a href="04-ultra-clear-day-viaduct.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>04-ultra-clear-day-vehicle</h2><a href="04-ultra-clear-day-vehicle.png"><img src="04-ultra-clear-day-vehicle.png" loading="lazy"></a><figcaption>Daytime vehicle paint and wheel layers, sidewalk furniture, facade divisions and finer overhead-rail shadows are readable. The vehicle interior and nose are still stylized. A large near road rectangle remains almost featureless; these observations are separate from the clean draw result.</figcaption><a href="04-ultra-clear-day-vehicle.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>05-balanced-wet-night-viaduct</h2><a href="05-balanced-wet-night-viaduct.png"><img src="05-balanced-wet-night-viaduct.png" loading="lazy"></a><figcaption>The balanced scene retains the roadway, columns, elevated decks, warm windows and several street-light pools. Distant fixture brightness and reflections are less developed, and distant outlines/diagonal details are visibly coarser than the high/ultra frames. The lower draw count does not by itself establish acceptable art or hardware performance.</figcaption><a href="05-balanced-wet-night-viaduct.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>05-balanced-wet-night-vehicle</h2><a href="05-balanced-wet-night-vehicle.png"><img src="05-balanced-wet-night-vehicle.png" loading="lazy"></a><figcaption>The same vehicle, storefront, furniture, paving and headlamp pool remain visible in balanced quality. Glazing and wheel/body detail are more simplified, with a largely opaque brown roof/glass appearance and coarse edges. The large white headlamp patch remains clipped.</figcaption><a href="05-balanced-wet-night-vehicle.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>06-high-wet-night-viaduct</h2><a href="06-high-wet-night-viaduct.png"><img src="06-high-wet-night-viaduct.png" loading="lazy"></a><figcaption>Returning from balanced to high restores the visible wet reflections and distant brighter fixture rhythm while retaining the road, buildings and decks. The upper towers and near shop pockets remain dark; the near flat fitting still lacks visual identification cues.</figcaption><a href="06-high-wet-night-viaduct.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>06-high-wet-night-vehicle</h2><a href="06-high-wet-night-vehicle.png"><img src="06-high-wet-night-vehicle.png" loading="lazy"></a><figcaption>The high-quality vehicle/window/wheel layers and near storefront-light falloff are visible again after the balanced switch. The foreground headlamp pools remain clipped and several background facade sections remain dark. There is no visual claim of a full material-realism solution.</figcaption><a href="06-high-wet-night-vehicle.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>07-ultra-wet-night-viaduct</h2><a href="07-ultra-wet-night-viaduct.png"><img src="07-ultra-wet-night-viaduct.png" loading="lazy"></a><figcaption>The final ultra wet frame contains the full road/deck/column composition, warm pools, reflected light and sparse windows after the repeated quality sequence. Deep facade shadows, repeating upper forms and clipped distant fixtures persist. This last frame is not a moving-route or all-city coverage test.</figcaption><a href="07-ultra-wet-night-viaduct.json">Original same-frame conditions and actual exported draw audit</a></figure><figure><h2>07-ultra-wet-night-vehicle</h2><a href="07-ultra-wet-night-vehicle.png"><img src="07-ultra-wet-night-vehicle.png" loading="lazy"></a><figcaption>The final vehicle image retains the car, wheel layers, road marks, storefronts, food stalls and separate headlamp/shop-light contributions. Dark simplified glazing, the broad front opening, near white clipping and the plain road fitting remain visible limitations.</figcaption><a href="07-ultra-wet-night-vehicle.json">Original same-frame conditions and actual exported draw audit</a></figure>
